# Nixpacks configuration for Railway
# This tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ["nodejs-18_x", "python311"]

[phases.install]
cmds = [
  "npm install",
  "cd backend && python3 -m venv venv",
  "cd backend && source venv/bin/activate && python3 -m pip install --upgrade pip",
  "cd backend && source venv/bin/activate && python3 -m pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "pwd",
  "echo 'Current directory:' && pwd",
  "echo 'Files in root:' && ls -la",
  "npm run check || true",
  "echo 'Starting production build...'",
  "npm run build || (echo 'Build failed!' && exit 1)",
  "echo 'Build completed. Checking dist directory...'",
  "pwd",
  "ls -la dist/ || (echo 'ERROR: dist directory not found!' && exit 1)",
  "ls -la dist/index.cjs || (echo 'ERROR: dist/index.cjs not found!' && exit 1)",
  "ls -la dist/public || (echo 'ERROR: dist/public not found!' && exit 1)",
  "echo 'Build verification complete. All files present.'",
  "echo 'Final dist contents:' && find dist -type f | head -20"
]

[start]
cmd = "cd /app && NODE_ENV=production node dist/index.cjs"

