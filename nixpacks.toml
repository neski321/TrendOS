# Nixpacks configuration for Railway
# This tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ["nodejs-18_x", "python311"]

[phases.install]
cmds = [
  "npm install",
  "cd backend && python3 -m venv venv",
  "cd backend && source venv/bin/activate && python3 -m pip install --upgrade pip",
  "cd backend && source venv/bin/activate && python3 -m pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "pwd",
  "echo '=== BUILD PHASE ==='",
  "echo 'Current directory:' && pwd",
  "echo 'Files in root:' && ls -la",
  "npm run check || true",
  "echo 'Starting production build...'",
  "npm run build || (echo 'Build failed!' && exit 1)",
  "echo 'Build completed. Verifying output...'",
  "pwd",
  "echo 'Checking dist directory exists...'",
  "test -d dist || (echo 'ERROR: dist directory not found!' && exit 1)",
  "echo 'Checking dist/index.cjs exists...'",
  "test -f dist/index.cjs || (echo 'ERROR: dist/index.cjs not found!' && ls -la dist/ && exit 1)",
  "echo 'Checking dist/public exists...'",
  "test -d dist/public || (echo 'ERROR: dist/public not found!' && ls -la dist/ && exit 1)",
  "echo 'Build verification complete. All files present.'",
  "echo 'dist/index.cjs size:' && ls -lh dist/index.cjs",
  "echo 'Final dist contents:' && find dist -type f | head -20",
  "echo 'Ensuring start scripts are executable...'",
  "chmod +x start-production.sh start-worker.sh || true",
  "echo '=== BUILD PHASE COMPLETE ==='"
]

[start]
cmd = "./start-production.sh"

