# Nixpacks configuration for Railway
# This tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ["nodejs-18_x", "python311"]

[phases.install]
cmds = [
  "npm install"
]

[phases.build]
cmds = [
  "npm run build",
  "chmod +x railway-build.sh railway-start.sh",
  "./railway-build.sh"
]

[start]
cmd = "./railway-start.sh"
